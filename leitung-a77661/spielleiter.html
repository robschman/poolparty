<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIP-Schnitzeljagd — Spielleiter-Zettel</title>
<style>
*{box-sizing:border-box}
body{margin:0; background:#e8e6e1; color:#1a1a1a; font-size:14px; line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}

/* Feste Breite in Millimetern. Safari am iPhone druckt sonst in FENSTERbreite —
   bei 390 px wird das Blatt rund 100 mm breit und ein Meter lang. */
.blatt{width:190mm; margin:20px auto; padding:0; background:#fff;
  box-shadow:0 10px 40px rgba(0,0,0,.18)}
.innen{padding:9mm 9mm 7mm}

h1{font-family:Didot,Georgia,serif; font-size:23px; margin:0; line-height:1}
.unterzeile{color:#8a8a8a; font-size:10.5px; margin:2px 0 0}
.kopfzeile{display:flex; justify-content:space-between; align-items:flex-end;
  border-bottom:2px solid #d4af37; padding-bottom:4px; margin-bottom:7px}
.notfall{font-size:10px; color:#6a6a6a; text-align:right; line-height:1.4}
.notfall b{color:#8a7320}

h2{font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:#8a7320;
  border-bottom:1px solid #e3d9b4; padding-bottom:2px; margin:0 0 4px}

.reihe{display:flex; gap:6mm; margin:0 0 6px}
.reihe > div{flex:1; min-width:0}

.kasten{border:1px solid #e0dcd2; border-radius:6px; padding:6px 8px; background:#fafaf7;
  font-size:11.5px; line-height:1.5}
.kasten b{color:#333}
.loesung{font-weight:800; background:#fffbe8; padding:1px 5px; border-radius:4px;
  border:1px solid #ecdca0; display:inline-block; white-space:nowrap}
.wort{font-family:Didot,Georgia,serif; font-size:26px; font-weight:900; letter-spacing:.14em;
  text-align:center; padding:4px; background:#faf8f0; border:2px solid #d4af37;
  border-radius:7px; line-height:1.1}
.klein{color:#7a7a7a; font-size:10px; line-height:1.4; display:block; margin-top:2px}

/* Die Stationen in zwei Spalten nebeneinander */
.spalten{display:flex; gap:5mm}
.spalten > div{flex:1; min-width:0}
table{width:100%; border-collapse:collapse; font-size:10.5px}
td{padding:2.2px 3px; border-bottom:1px solid #eee; vertical-align:top}
tr:last-child td{border-bottom:0}
td.nr{width:14px; color:#b0b0b0; font-weight:700; text-align:right}
td.b{width:15px; text-align:center; font-family:Didot,Georgia,serif; font-size:14px;
  font-weight:900; color:#8a7320; line-height:1.1}
td.was{line-height:1.35}
td.was b{font-size:11px}
td.was .ort{color:#8a8a8a; font-size:9.5px; display:block}
td.lsg{text-align:right; white-space:nowrap; font-size:10px}
td.lsg .loesung{font-size:10px}
td.lsg .frei{color:#a0a0a0; font-style:italic; font-size:9.5px; white-space:normal}

.fuss{display:flex; gap:6mm; margin-top:6px}
.fuss > div{flex:1}
.warnung{background:#fff8e1; border:1px solid #e0c060; border-radius:6px;
  padding:5px 8px; font-size:10.5px; margin:0 0 6px; line-height:1.45}

.knopfleiste{max-width:190mm; margin:16px auto -6px; padding:0 4px}
.knopfleiste button{padding:11px 20px; border:0; border-radius:9px; background:#1a1a1a;
  color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit}

@media print{
  body{background:#fff}
  .knopfleiste{display:none}
  .blatt{width:190mm; margin:0 auto; box-shadow:none}
  .innen{padding:0}
  @page{size:A4 portrait; margin:10mm}
}
</style>
</head>
<body>
<div class="knopfleiste"><button onclick="window.print()">Drucken (⌘ P)</button></div>
<div class="blatt"><div class="innen" id="blatt">Lade …</div></div>

<script src="../_ZUM-HOCHLADEN/js/stationen.js"></script>
<script>
(function(){
  var MODUS = (new URLSearchParams(location.search).get('modus')) || SPIEL.modus || 'lang';
  var AKTIV = STATIONEN.filter(function(s){ return !s.modi || s.modi.indexOf(MODUS) > -1; });
  var wort  = (SPIEL.loesungswort||'').toUpperCase();
  var mitBuchstabe = AKTIV.filter(function(s){ return s.buchstabe; });

  /* Buchstaben durcheinander verteilen — genau wie in der App */
  var BUCHSTABEN = (function(){
    var misch = (SPIEL.buchstabenReihenfolge && SPIEL.buchstabenReihenfolge.length===wort.length)
              ? SPIEL.buchstabenReihenfolge : wort.split('').map(function(_,i){ return i; });
    var folge = misch.map(function(i){ return wort[i]; });
    var st = [], karte = {};
    AKTIV.forEach(function(s,i){ if(s.buchstabe){ st.push(i); karte[i]=[]; } });
    if(!st.length) return karte;
    folge.forEach(function(b,n){ karte[st[n % st.length]].push(b); });
    return karte;
  })();

  /* Nur die Lösung, kurz. Die Tipps stehen in der App und in Tipps.html —
     auf einem Ein-Seiten-Zettel wären sie der halbe Platz. */
  function loesung(s){
    var g = function(t){ return '<span class="loesung">'+t+'</span>'; };
    var f = function(t){ return '<span class="frei">'+t+'</span>'; };
    switch(s.typ){
      case 'code':     return g(s.antwort);
      case 'spiegel':  return g(s.antwort);
      case 'kennwort': return g(SPIEL.kennwortTeil1+' + '+SPIEL.kennwortTeil2);
      case 'anruf':    return g(SPIEL.anrufCode);
      case 'finale':   return g(wort);
      case 'duell':    return f('Wort des anderen');
      case 'quiz':     return f(s.fragen.map(function(fr,i){
                              return (i+1)+'. '+fr.optionen[fr.richtig]; }).join(' · '));
      case 'foto':     return f((s.mindestens||s.auftraege.length)+' von '+s.auftraege.length+' Haken');
      case 'handyaus': return f('Fake, '+(s.sekunden||60)+' s');
      case 'stoppuhr': return f('schätzen, '+(s.sekunden||30)+' s');
      case 'sprint':   return f('Countdown '+(s.sekunden||180)+' s');
      case 'start':    return f('nur bestätigen');
      default:         return f('—');
    }
  }

  function zeile(s, i){
    return '<tr>'
      + '<td class="nr">'+i+'</td>'
      + '<td class="b">'+((BUCHSTABEN[i]||[]).join(''))+'</td>'
      + '<td class="was"><b>'+s.titel+'</b>'
      + (s.ort ? '<span class="ort">'+s.ort+'</span>' : '') + '</td>'
      + '<td class="lsg">'+loesung(s)+'</td>'
      + '</tr>';
  }

  var haelfte = Math.ceil(AKTIV.length/2);
  var links  = AKTIV.map(zeile).slice(0, haelfte).join('');
  var rechts = AKTIV.map(zeile).slice(haelfte).join('');

  var duell = STATIONEN.filter(function(s){ return s.typ==='duell'; })[0] || {};
  var teams = SPIEL.teams.map(function(t,n){
    var lsg = (duell.teamAufloesung||[])[n] || '';
    /* aus „Eure Emojis stehen für das Lied „GOLDEN“." nur GOLDEN herausholen */
    var lied = (lsg.match(/„([^“]+)“/) || [])[1] || '';
    return '<b>'+t.name+'</b> → <span class="loesung">'+t.geheimwort+'</span>'
         + (lied ? ' <span style="color:#8a8a8a;font-size:10px">zeigt: '+lied+'</span>' : '');
  }).join('<br>');

  document.getElementById('blatt').innerHTML =
    '<div class="kopfzeile">'
  +   '<div><h1>Spielleiter-Zettel</h1>'
  +   '<p class="unterzeile">'+SPIEL.titel+' · '+SPIEL.datum
  +   ' · Fassung <b>'+MODUS.toUpperCase()+'</b></p></div>'
  +   '<div class="notfall"><b>Nicht herzeigen.</b><br>Notfall: Krone oben links '
  +   '<b>3×</b> antippen, Code <b>'+SPIEL.leiterCode+'</b></div>'
  + '</div>'

  + '<div class="reihe">'
  +   '<div><h2>Am Telefon</h2><div class="kasten">'
  +     '<b>Sie sagen:</b> <span class="loesung">'+SPIEL.kennwortTeil1+' '+SPIEL.kennwortTeil2+'</span><br>'
  +     '<b>Du gibst:</b> <span class="loesung">'+SPIEL.anrufCode+'</span>'
  +     '<span class="klein">Team 1 findet „'+SPIEL.kennwortTeil1+'“, Team 2 „'+SPIEL.kennwortTeil2
  +     '“. Danach: „Geht dorthin, wo der Osterhase wohnt.“ Auflegen ohne Tschüss.</span>'
  +   '</div></div>'
  +   '<div><h2>Losungswort am Tor</h2><div class="wort">'+wort+'</div>'
  +     '<span class="klein">Dazu muss jedes Handgelenk ein Einlassband tragen.</span></div>'
  + '</div>'

  + '<h2>Alle Stationen und Lösungen</h2>'
  + '<div class="spalten">'
  +   '<div><table>'+links+'</table></div>'
  +   '<div><table>'+rechts+'</table></div>'
  + '</div>'

  + '<div class="fuss">'
  +   '<div><h2>Geheimwörter fürs Emoji-Duell</h2><div class="kasten">'+teams
  +     '<span class="klein">Jedes Team muss das Wort des ANDEREN eintippen. '
  +     'Das eigene wird nicht angenommen.</span></div></div>'
  +   '<div><h2>Punkte</h2><div class="kasten">'
  +     SPIEL.punkteProStation+' je Station · −'+SPIEL.abzugTipp+' Tipp · −'
  +     (SPIEL.abzugTipp2||SPIEL.abzugTipp)+' zweiter Tipp · −'+SPIEL.abzugFehler+' je Fehler<br>'
  +     'Nie weniger als '+Math.round(SPIEL.punkteProStation*0.2)+' · alle Foto-Aufträge +25'
  +     '<span class="klein">Höchstens rund '
  +     (mitBuchstabe.length*SPIEL.punkteProStation+25)+' Punkte.</span>'
  +   '</div></div>'
  + '</div>';
})();
</script>
</body>
</html>
